name: Build CV
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Application folder name (e.g. 2026-11_company-role)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: applications/${{ inputs.folder }}/cv.tex
          work_in_root_file_dir: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.folder }}
          path: applications/${{ inputs.folder }}/cv.pdf
