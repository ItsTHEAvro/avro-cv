name: Build CV
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Application folder name (e.g. 2026-11_company-role)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FOLDER: ${{ inputs.folder }}
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: applications/${{ inputs.folder }}/cv.tex
          work_in_root_file_dir: true

      - name: Commit PDF to the application folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "applications/$FOLDER/cv.pdf"
          if git diff --cached --quiet; then
            echo "PDF unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Build: $FOLDER"
          git push