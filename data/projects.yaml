- id: nids-thesis
  title: Hierarchical Network Intrusion Detection System for IIoT (Undergraduate Thesis)
  org: PSTU
  date: 2026
  tech: [Python, scikit-learn, XGBoost, DCNv2, SHAP, Pandas]
  dataset: DataSense (CICIIoT2025)
  publication: compas-2026-nids
  links: { portfolio: "https://avro.bd/projects/1_project/" }
  tags: [ml, xai, cybersec, networking, research]
  priority: high
  bullets:
    - text: Built a two-stage hierarchical ML model on the CICIIoT2025 dataset for edge NIDS, integrating SHAP explanations and using chronological validation to eliminate 21 percentage points of data leakage inflation.
      tags: [ml, cybersec]
      note: one-line version
    - text: Designed a dual-stream Stage 1 triage combining an XGBoost classifier over a 43-feature MQTT telemetry vector with parallel L3/L4 network heuristics, reaching 0.985 Macro-F1 at about 12.5 ms triage latency on a desktop baseline.
      tags: [ml, networking]
    - text: Forwarded flagged and low-confidence traffic to a Stage 2 deep classifier, benchmarking DCNv2 inference cost against tree ensembles to profile edge-deployment feasibility.
      tags: [ml, swe]
    - text: Showed that random-split cross-validation inflated performance by up to 21 percentage points, and adopted strict chronological evaluation to remove the leakage.
      tags: [ml, research]
    - text: Validated generalization with Leave-One-Attack-Out testing; recall stayed above 98% on Brute Force and MITM but fell to 26.70% on Malware, with the boundary mapped through SHAP analysis.
      tags: [ml, xai, cybersec, research]
    - text: Built an offline Intrusion Prevention System prototype demonstrating mitigation rule synthesis.
      tags: [cybersec, swe]

